name: AI Code Optimization

on:
  push:
    branches:
      - semjon-dev
  pull_request:

jobs:
  optimize-code:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python installieren
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Dependencies installieren
        run: |
          pip install fastapi uvicorn requests flake8 python-dotenv

      - name: Set API Key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: echo "DeepSeek API key set"

      - name: Backend starten
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 --log-level debug &
          sleep 5

      - name: Run CLI client
        run: |
          for file in $(find . -name "*.py" -not -path "./cli/*" -not -path "./backend/*" -not -path "./services/*"); do
            echo "Processing $file"
            python3 cli/cli_client.py "$file"
          done